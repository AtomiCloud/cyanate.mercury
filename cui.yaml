# Mecury Pipeline Configuration
# =============================

# Scraper output directory (structure.json, schema.json, content.json)
input: ./example/

# Reference website whose design to replicate
reference: https://vercel.com/

# Global LLM defaults (used when no profile override matches)
defaults:
  provider: anthropic
  model: claude-sonnet-4-20250514
  maxTurns: 20

# Cascading profile overrides
# Key format: segment | segment.phase | segment.phase.step
# More specific keys take priority.
profiles:
  # Use Opus for the analyze segment (all phases/steps)
  # analyze:
  #   model: claude-opus-4-20250514
  #   maxTurns: 30

  # Use a faster model for layout build steps
  # layout.build.make:
  #   model: claude-sonnet-4-20250514

  # Use Opus for design judges
  # layout.build.judge:
  #   model: claude-opus-4-20250514

# Heartbeat configuration
heartbeat:
  # ms before an agent is considered dead and gets terminated (default: 900000 = 15 min)
  # High-context agents (5M+ tokens) can have long API waits, so this is generous.
  timeout: 900000
  # ms between heartbeat log lines in non-interactive/verbose mode (default: 30000 = 30s)
  interval: 30000

# Logging configuration
logging:
  # Filename for per-step agent event logs (JSONL format)
  eventsFile: agent-events.jsonl
  # Filename for SDK debug trace logs
  debugFile: agent-debug.log
