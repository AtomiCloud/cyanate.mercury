# Mecury Pipeline Configuration
# =============================

# Scraper output directory (structure.json, schema.json, content.json)
input: ./example/physio

# Reference website whose design to replicate
reference: https://vercel.com/

# Global LLM defaults (used when no profile override matches)
defaults:
  provider: anthropic
  model: zai-org/GLM-5.1
  maxTurns: 80
  env:
    ANTHROPIC_BASE_URL: http://localhost:8317/

# Cascading profile overrides
# Key format: segment | segment.phase | segment.phase.step
# More specific keys take priority.
profiles:
  # ---- Vision tasks (screenshots → LLM) ----
  # Analyze vision review
  analyze.validate.vision-review:
    model: accounts/fireworks/models/qwen3p6-plus

  # Wireframe vision review (QA phase)
  wireframe.validate.qa-vision:
    model: accounts/fireworks/models/qwen3p6-plus

  # Design — all vision reviewers
  design.typography.typography-vision-review:
    model: accounts/fireworks/models/qwen3p6-plus
  design.color.color-vision-review:
    model: accounts/fireworks/models/qwen3p6-plus
  design.motion.motion-vision-review:
    model: accounts/fireworks/models/qwen3p6-plus
  design.qa.qa-vision-review:
    model: accounts/fireworks/models/qwen3p6-plus

  # ---- Classify: per-page chrome classify (Stage 2) ----
  # Classifier runs on every page with no cross-page context; reviewer audits
  # one page at a time. Retries are per-page inside the fan-out step.
  classify.chrome-classify.chrome-classify-agent:
    model: zai-org/GLM-5
  classify.chrome-classify.chrome-classify-reviewer:
    model: zai-org/GLM-5.1

  # ---- Classify: chrome harmonize per page-type (Stage 3, split design) ----
  # harmonize-align is a dynamic per-pagetype tree-reduce over 20-page
  # batches; it loops until each pagetype converges to ≤ 1 batch. The agent
  # proposes rename ops per batch; a per-batch reviewer sees values so it
  # can catch mis-judged aliases the programmatic validator can't. verdicts
  # is where semantic judgment matters; assembler is programmatic.
  classify.harmonize-align.align-agent:
    model: zai-org/GLM-5
    maxTurns: 200
  classify.harmonize-align.align-reviewer:
    model: zai-org/GLM-5.1
  classify.harmonize-verdicts.verdicts-agent:
    model: zai-org/GLM-5.1
  classify.harmonize-verdicts.verdicts-reviewer:
    model: zai-org/GLM-5

  # `./suggest` spawns a fresh LLM sub-agent per call to propose alias clusters
  # (replaces the old heuristic function). Shared across all align iterations.
  classify.harmonize.suggest-agent:
    model: zai-org/GLM-5

  # `./review` spawns a fresh LLM sub-agent to audit the current ops.json
  # before the outer align agent commits. Returns pass/fail so the agent knows
  # whether it can stop or must continue. Shared across all align iterations.
  classify.harmonize.review-agent:
    model: zai-org/GLM-5.1

  # `./ops-ify` materializes one accepted alias cluster into RichRenameOps via
  # the domain-ops generator: one generator + two independent reviewers with
  # AND-consensus. Different reviewer models give independent hallucination
  # detection.
  classify.harmonize-align.ops-ify-generate:
    model: zai-org/GLM-5
  classify.harmonize-align.ops-ify-review-a:
    model: MiniMaxAI/MiniMax-M2.5
  classify.harmonize-align.ops-ify-review-b:
    model: zai-org/GLM-5.1

  # ---- mm25: automated reviewers only (no real LLM reasoning needed) ----
  wireframe.generate.static-checks-review:
    model: MiniMaxAI/MiniMax-M2.5
  wireframe.generate.console-error-review:
    model: MiniMaxAI/MiniMax-M2.5
  design.qa.qa-static-checks:
    model: MiniMaxAI/MiniMax-M2.5
  design.qa.qa-console-errors:
    model: MiniMaxAI/MiniMax-M2.5

# Friendli per-1M-token pricing (USD), keyed by model id.
# resolveProfile populates profile.pricing from this map when no inline
# override is set, so every step using the same model is priced identically.
# Buckets: input = uncached input + cache-creation | cachedInput = cache read | output
modelPricing:
  zai-org/GLM-5.1:
    input: 1.4
    cachedInput: 0.26
    output: 4.4
  zai-org/GLM-5:
    input: 1
    cachedInput: 0.5
    output: 3.2
  accounts/fireworks/models/minimax-m2p7:
    input: 0.3
    cachedInput: 0.06
    output: 1.2

  MiniMaxAI/MiniMax-M2.5:
    input: 0.3
    cachedInput: 0.06
    output: 1.2

# Per-model max output tokens. Populated onto `profile.maxTokens` by
# resolveProfile when not set inline. GLM-5.1 is a reasoning model whose
# thinking burns output budget, so it needs more than the 4096 default.
modelMaxTokens:
  zai-org/GLM-5: 32768
  zai-org/GLM-5.1: 32768

# Classify segment config
classify:
  # Local SonicJS instance URL — Phase 9d hard-gates on roundtrip pass
  localSonicJsUrl: http://localhost:8787
  # Optional: override the default harmonize-align batch size (default 5).
  # Lower values keep agent prompts small but cost more iterations; higher
  # values converge faster on sparse chrome but may exceed the model's
  # reliable per-turn ceiling.
  # pagesPerBatch: 5

# Heartbeat configuration
heartbeat:
  timeout: 900000
  interval: 30000

# Logging configuration
logging:
  eventsFile: agent-events.jsonl
  debugFile: agent-debug.log
